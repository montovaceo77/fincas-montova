<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fincas Montova · Monitoreo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --verde: #3B6B4A;
  --verde-light: #EAF2EC;
  --verde-mid: #6A9B78;
  --verde-pale: #F2F8F4;
  --verde-dark: #2A4D36;
  --ink: #1E2E24;
  --ink-mid: #5A7060;
  --ink-soft: #9AB0A0;
  --cream: #F8FAF8;
  --white: #FFFFFF;
  --border: #D4E4D8;
  --visited-bg: #DCDCDC;
  --visited-border: #4F8C61;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.6; padding-bottom: 40px; }

.header { background: var(--ink); padding: 0.9rem 1.25rem; }
.header-inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.header-title { font-size: 20px; font-weight: 700; color: #fff; }
.header-sub { font-size: 11px; color: #B9C7BF; }
.header-btn { background: transparent; border: 1.5px solid #6A9B78; color: #DCEDE2; font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
.header-btn:active { background: rgba(255,255,255,0.08); }

.resumen-title { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.resumen-rango { font-size: 12px; color: var(--ink-mid); margin-bottom: 1.25rem; }
.totales-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
.totales-grid.full { grid-template-columns: 1fr; }
.total-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.total-num { font-size: 26px; font-weight: 700; color: var(--verde-dark); }
.total-lbl { font-size: 12px; color: var(--ink-mid); margin-top: 2px; }
.breakdown-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.breakdown-row:last-child { border-bottom: none; }
.breakdown-row .n { font-weight: 700; color: var(--verde-dark); }

.empty-state { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 2rem 1rem; }

.filtro-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
.chip { padding: 8px 14px; font-size: 12px; font-weight: 600; border-radius: 20px; border: 1.5px solid var(--verde-mid); background: #fff; color: var(--ink-mid); cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
.chip.on { background: var(--verde-dark); border-color: var(--verde-dark); color: #fff; }

.grupo-card { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--white); }
.grupo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: #EDEDED; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
.grupo-count { font-weight: 400; color: var(--ink-mid); font-size: 12px; }
.grupo-chevron { color: var(--ink-mid); font-size: 11px; flex-shrink: 0; }

.plaga-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.plaga-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11.5px; }
.plaga-table th { text-align: left; padding: 8px 4px; background: #fff; color: var(--ink-mid); font-weight: 700; border-bottom: 2px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plaga-table td { padding: 8px 4px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plaga-table th:first-child, .plaga-table td:first-child { width: 32%; }
.plaga-table th:nth-child(2), .plaga-table td:nth-child(2) { width: 12%; }
.plaga-table th:nth-child(3), .plaga-table td:nth-child(3) { width: 19%; }
.plaga-table th:nth-child(4), .plaga-table td:nth-child(4) { width: 19%; }
.plaga-table th:nth-child(5), .plaga-table td:nth-child(5) { width: 18%; }
.plaga-table tr:last-child td { border-bottom: none; }
.plaga-table tr.row-sano td { color: var(--verde-dark); font-weight: 600; }
.plaga-table tr.row-alt td { background: var(--verde-pale); }

.summary-wrap { background: var(--white); border-bottom: 1px solid var(--border); }
.summary { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.summary-cell { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border); cursor: pointer; }
.summary-cell:nth-child(3n+1), .summary-cell:nth-child(3n+2) { border-right: 1px solid var(--border); }
.summary-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-mid); }
.summary-value { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 2px; min-height: 18px; }
.summary-value.empty { color: var(--ink-soft); font-weight: 400; font-style: italic; }
.summary-cell.active { background: var(--verde-light); }
.summary-cell.active .summary-label { color: var(--verde-dark); }

.main { max-width: 480px; margin: 0 auto; padding: 1.5rem 1.25rem 1rem; }

.step-title { font-size: 22px; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 1.5rem; }

.btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.btn-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.pick-btn {
  padding: 16px 14px; font-size: 16px; font-weight: 600; font-family: 'DM Sans', sans-serif;
  border-radius: 10px; border: 2px solid var(--verde-mid); background: var(--white); color: var(--ink);
  cursor: pointer; text-align: center; transition: background 0.15s;
}
.pick-btn:active { background: var(--verde-light); }
.pick-btn.visited { background: var(--visited-bg); border-color: var(--visited-border); }
.pick-btn.done { background: var(--verde-dark); border-color: var(--verde-dark); color: #fff; }

.date-row { display: flex; gap: 10px; align-items: center; }
.date-row input[type="date"] {
  flex: 1; padding: 14px 12px; font-size: 16px; font-family: 'DM Sans', sans-serif;
  border: 2px solid var(--verde-mid); border-radius: 10px; color: var(--ink); background: #fff;
}
.btn-continuar { padding: 14px 20px; font-size: 15px; font-weight: 600; background: var(--verde-dark); color: #fff; border: none; border-radius: 10px; cursor: pointer; }

.lote-hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: -8px; margin-bottom: 1rem; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; }
.card-title { font-size: 13px; font-weight: 700; color: var(--verde-dark); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px; }

.puntos-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.punto-btn { border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; text-align: left; padding: 10px; gap: 4px; min-height: 78px; border: 1.5px solid var(--border); background: #fff; font-family: 'DM Sans', sans-serif; }
.punto-btn .cq-title { font-size: 13px; font-weight: 700; color: var(--ink-mid); }
.punto-btn .cq-list { font-size: 11px; line-height: 1.4; color: var(--verde-dark); }
.punto-btn.on { background: var(--verde-dark); border-color: var(--verde-dark); }
.punto-btn.on .cq-title { color: #fff; }
.punto-btn.on .cq-list { color: #fff; opacity: 0.95; }
.punto-btn.hasdata:not(.on) { background: var(--verde-light); border-color: var(--verde-mid); }
.punto-btn.hasdata:not(.on) .cq-title { color: var(--verde-dark); }

.plagas-lista { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; background: #fafafa; }
.plaga-item { padding: 10px 12px; font-size: 13px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--border); color: var(--ink-mid); width: 100%; text-align: left; font-family: 'DM Sans', sans-serif; }
.plaga-item.sel { background: var(--verde-light); border-color: var(--verde-mid); color: var(--verde-dark); font-weight: 600; }
.plaga-chk { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; color: #fff; }
.plaga-item.sel .plaga-chk { background: var(--verde-dark); border-color: var(--verde-dark); }

.sev-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.sev-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #fff; }
.sev-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
.sev-track { position: relative; height: 10px; border-radius: 5px; background: #EAEAEA; margin: 0 10px; touch-action: none; }
.sev-track-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 5px; background: transparent; transition: width 0.1s; }
.sev-thumb { position: absolute; top: 50%; width: 24px; height: 24px; border-radius: 50%; transform: translate(-12px, -50%); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.3); transition: left 0.1s, background 0.1s; }
.sev-bottom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.sev-label { font-size: 13px; font-weight: 700; }
.sev-clear { font-size: 12px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; }

.actions-row { display: flex; gap: 10px; margin-top: 1rem; }
.btn-guardar { flex: 1; padding: 15px; font-size: 16px; font-weight: 600; background: var(--verde-dark); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
.btn-guardar:disabled { opacity: 0.5; }
.btn-nuevo { padding: 15px 18px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; background: var(--white); border: 1px solid var(--border); color: var(--ink-mid); white-space: nowrap; font-family: 'DM Sans', sans-serif; }

.status-box { display: none; margin-top: 1rem; border-radius: 12px; padding: 1rem 1.25rem; font-size: 14px; }
.status-loading { background: var(--white); border: 1px solid var(--border); color: var(--ink-mid); text-align: center; }
.status-ok { background: var(--verde-light); border: 1px solid var(--verde-mid); }
.status-ok-title { font-size: 15px; font-weight: 600; color: var(--verde-dark); margin-bottom: 4px; }
.status-ok-txt { font-size: 13px; color: var(--verde); }
.status-error { background: #fff0f0; border: 1px solid #ffcccc; color: #c0392b; }

.info-box { background: var(--verde-light); border: 1px solid var(--verde-mid); border-radius: 8px; padding: 10px 12px; margin-bottom: 1rem; font-size: 13px; color: var(--verde-dark); line-height: 1.6; }
.legend { display: flex; gap: 14px; justify-content: center; margin-bottom: 1rem; font-size: 11px; color: var(--ink-mid); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 12px; height: 12px; border-radius: 4px; border: 1.5px solid var(--verde-mid); display: inline-block; }
.dot.visited { background: var(--visited-bg); border-color: var(--visited-border); }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">Monitoreo</div>
      <div class="header-sub">Fincas Montova</div>
    </div>
    <button class="header-btn" id="btn-toggle-view" onclick="toggleView()">Registros de la semana</button>
  </div>
</div>

<div id="view-wizard">
  <div class="summary-wrap">
    <div class="summary" id="summary"></div>
  </div>

  <div class="main" id="main"></div>
</div>

<div id="view-resumen" style="display:none;"></div>

<script>
// ===== Mismo backend (Apps Script Web App) que usa el resto de Fincas Montova =====
var WS = 'https://script.google.com/macros/s/AKfycbxvOw581dgZvxuuwSCi0RMj_gKkJbcrkTz9vpvQri0WntOxUrT1q35ngnuO5myq60Dx/exec';

var FUM_PLAGAS_SEVERIDAD = ['Acaro blanco', 'Acaro rojo', 'Botrytis', 'Trips'];
var FUM_PLAGAS_CHECK = ['Afidos', 'Alternaria', 'Babosa', 'Ceniza', 'Chinche', 'Coleopteros', 'Fitoftora', 'Lepidopteros', 'Mancha foliar', 'Secadera'];
var NIVELES = ['Leve', 'Moderado', 'Severo'];
var NIVEL_COLORES = ['#F5C518', '#F28C28', '#E53935'];

var FINCAS = ['Flor Esperancita','Flor de Agua 3','Oasis Garden','Flor Madera'];

var lotes = [];
var monitoreos = [];

var st = {
  fecha: new Date().toISOString().split('T')[0],
  finca: '',
  loteNum: '',
  variedad: '',
  fechaInicioLote: '',
  camasTotal: 0,
  cama: '',
  puntoActivo: 1
};
var puntosCheck = {1:[], 2:[], 3:[]};
var puntosSeveridad = {1:{}, 2:{}, 3:{}};

function itemsPunto(n) {
  var check = puntosCheck[n].slice();
  var sev = puntosSeveridad[n];
  Object.keys(sev).forEach(function(item) {
    check.push(item + ' (' + NIVELES[sev[item]] + ')');
  });
  if (check.length === 0) return ['Punto Sano'];
  return check;
}

window.addEventListener('DOMContentLoaded', function() {
  fetchLotes();
  fetchMonitoreos();
  render();
});

// ===== Fetch de datos ya registrados en otros modulos / en Monitoreo mismo =====
function fetchLotes() {
  fetch(WS + '?action=getLotes').then(function(r) { return r.json(); }).then(function(data) {
    lotes = Array.isArray(data) ? data : [];
    render();
  }).catch(function() { lotes = []; });
}

function fetchMonitoreos() {
  fetch(WS + '?action=getMonitoreo').then(function(r) { return r.json(); }).then(function(data) {
    monitoreos = Array.isArray(data) ? data : [];
    render();
  }).catch(function() { monitoreos = []; });
}

// ===== Utilidades =====
function fmtDate(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length < 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0];
}

function calcSemanaCiclo(fechaISO) {
  if (!fechaISO) return null;
  var inicio = new Date(fechaISO + 'T12:00:00');
  if (isNaN(inicio)) return null;
  var hoy = new Date();
  var diff = Math.floor((hoy - inicio) / (7 * 24 * 60 * 60 * 1000));
  return diff < 0 ? 0 : diff;
}

function getISO(val) {
  if (!val) return '';
  var s = String(val).trim();
  if (s.length >= 10) return s.substring(0, 10);
  return '';
}

function getWeekRange(hoy) {
  var d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  var dow = d.getDay(); // 0=domingo, 1=lunes...
  var diffToMonday = dow === 0 ? -6 : 1 - dow;
  var monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  var sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  function toISO(x) {
    var m = ('0' + (x.getMonth() + 1)).slice(-2);
    var day = ('0' + x.getDate()).slice(-2);
    return x.getFullYear() + '-' + m + '-' + day;
  }
  return { start: toISO(monday), end: toISO(sunday) };
}

var currentView = 'wizard';

function toggleView() {
  currentView = currentView === 'wizard' ? 'resumen' : 'wizard';
  document.getElementById('view-wizard').style.display = currentView === 'wizard' ? '' : 'none';
  document.getElementById('view-resumen').style.display = currentView === 'resumen' ? '' : 'none';
  document.getElementById('btn-toggle-view').textContent = currentView === 'wizard' ? 'Registros de la semana' : 'Volver a monitorear';
  if (currentView === 'resumen') renderResumen();
}

function calcSemanaAnio(fechaISO) {
  if (!fechaISO) return null;
  var d = new Date(fechaISO + 'T12:00:00');
  if (isNaN(d)) return null;
  var jan4 = new Date(d.getFullYear(), 0, 4);
  var monday1 = new Date(jan4);
  monday1.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1);
  var diff = d - monday1;
  return Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) + 1;
}

function getVariedadLote(finca, loteNumStr) {
  var l = lotes.find(function(x) {
    return String(x.Finca || x.finca || '') === String(finca) &&
           String(x.Lote || x.lote || '') === String(loteNumStr) &&
           String(x.Estado || x.estado || '').toLowerCase() === 'activo';
  });
  return l ? (l.Variedad || l.variedad || '') : '';
}

var gruposColapsados = {};
var resumenFincaFiltro = '';

function renderResumen() {
  var wrap = document.getElementById('view-resumen');
  wrap.innerHTML = '';
  var main = document.createElement('div');
  main.className = 'main';

  var rango = getWeekRange(new Date());
  var semanaNum = calcSemanaAnio(rango.start);
  var registrosSemana = monitoreos.filter(function(r) {
    var f = getISO(r.Fecha || r.fecha || '');
    return f >= rango.start && f <= rango.end;
  });

  var title = document.createElement('div');
  title.className = 'resumen-title';
  title.textContent = 'Registros de la semana';
  main.appendChild(title);

  var rangoEl = document.createElement('div');
  rangoEl.className = 'resumen-rango';
  rangoEl.textContent = 'Semana ' + semanaNum + ' \u00b7 ' + fmtDate(rango.start) + ' al ' + fmtDate(rango.end) + ' (lunes a domingo)';
  main.appendChild(rangoEl);

  // ---- Filtro por finca ----
  var fincasConDatos = FINCAS;
  var chipsWrap = document.createElement('div');
  chipsWrap.className = 'filtro-chips';
  var todasBtn = document.createElement('button');
  todasBtn.className = 'chip' + (resumenFincaFiltro === '' ? ' on' : '');
  todasBtn.textContent = 'Todas';
  todasBtn.onclick = function() { resumenFincaFiltro = ''; renderResumen(); };
  chipsWrap.appendChild(todasBtn);
  fincasConDatos.forEach(function(f) {
    var b = document.createElement('button');
    b.className = 'chip' + (resumenFincaFiltro === f ? ' on' : '');
    b.textContent = f;
    b.onclick = function() { resumenFincaFiltro = f; renderResumen(); };
    chipsWrap.appendChild(b);
  });
  main.appendChild(chipsWrap);

  if (resumenFincaFiltro) {
    registrosSemana = registrosSemana.filter(function(r) {
      return String(r.Finca || r.finca || '') === resumenFincaFiltro;
    });
  }

  if (registrosSemana.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Todavia no hay registros de monitoreo esta semana.';
    main.appendChild(empty);
    wrap.appendChild(main);
    return;
  }

  function loteNumOf(r) {
    var s = String(r.Lote || r.lote || '');
    var m = s.match(/(\d+)/);
    return m ? m[1] : '';
  }
  function camaNumOf(r) {
    return parseInt(r.Cama || r.cama || 0, 10) || 0;
  }

  // ---- Agrupar por Finca + Lote ----
  var grupos = {};
  registrosSemana.forEach(function(r) {
    var finca = r.Finca || r.finca || '';
    var loteN = loteNumOf(r);
    var key = finca + '|' + loteN;
    if (!grupos[key]) grupos[key] = { finca: finca, loteN: loteN, loteLabel: r.Lote || r.lote || '', items: [] };
    grupos[key].items.push(r);
  });

  var gruposArr = Object.keys(grupos).map(function(k) { return grupos[k]; });
  gruposArr.sort(function(a, b) {
    if (a.finca !== b.finca) return a.finca.localeCompare(b.finca);
    return parseInt(a.loteN, 10) - parseInt(b.loteN, 10);
  });

  gruposArr.forEach(function(g) {
    // Tomar el registro mas reciente por cama (por si se monitoreo mas de una vez esta semana)
    var porCama = {};
    g.items.forEach(function(r) {
      var cn = camaNumOf(r);
      var fISO = getISO(r.Fecha || r.fecha || '');
      if (!porCama[cn] || fISO >= getISO(porCama[cn].Fecha || porCama[cn].fecha || '')) {
        porCama[cn] = r;
      }
    });
    var camasArr = Object.keys(porCama).map(function(k) { return porCama[k]; });
    var camasMonitoreadas = camasArr.length;

    var sanas = 0;
    var plagaCamas = {}; // nombre plaga -> Set de camas afectadas
    var ordenPlagas = [];
    camasArr.forEach(function(r) {
      var cn = camaNumOf(r);
      var puntos = [1,2,3].map(function(n) {
        return String(r['Punto_' + n] || r['punto_' + n] || '').trim();
      });
      var esSana = puntos.every(function(p) { return !p || p === 'Punto Sano'; });
      if (esSana) { sanas++; return; }
      var afectadasEstaCama = {};
      puntos.forEach(function(p) {
        if (!p || p === 'Punto Sano') return;
        p.split(',').forEach(function(entry) {
          var nombre = entry.replace(/\s*\((Leve|Moderado|Severo)\)\s*$/i, '').trim();
          if (!nombre) return;
          afectadasEstaCama[nombre] = true;
        });
      });
      Object.keys(afectadasEstaCama).forEach(function(nombre) {
        if (!plagaCamas[nombre]) { plagaCamas[nombre] = {}; ordenPlagas.push(nombre); }
        plagaCamas[nombre][cn] = true;
      });
    });

    var rows = [];
    rows.push({ plaga: 'Punto sano', afectadas: sanas });
    ordenPlagas.forEach(function(nombre) {
      rows.push({ plaga: nombre, afectadas: Object.keys(plagaCamas[nombre]).length });
    });

    var variedad = getVariedadLote(g.finca, g.loteN);
    var groupKey = g.finca + '|' + g.loteN;
    var colapsado = !!gruposColapsados[groupKey];

    var groupCard = document.createElement('div');
    groupCard.className = 'grupo-card';

    var groupHead = document.createElement('div');
    groupHead.className = 'grupo-head';
    var headLbl = (resumenFincaFiltro ? '' : (g.finca + ' \u00b7 ')) + g.loteLabel + (variedad ? (' - ' + variedad) : '');
    groupHead.innerHTML = '<span>' + headLbl + ' <span class="grupo-count">\u00b7 ' + rows.length + ' items</span></span><span class="grupo-chevron">' + (colapsado ? '\u25b6' : '\u25be') + '</span>';
    groupHead.onclick = function() {
      gruposColapsados[groupKey] = !gruposColapsados[groupKey];
      renderResumen();
    };
    groupCard.appendChild(groupHead);

    if (!colapsado) {
      var tableWrap = document.createElement('div');
      tableWrap.className = 'plaga-table-wrap';
      var table = document.createElement('table');
      table.className = 'plaga-table';

      var thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Plaga</th><th>Sem</th><th>C. Mon.</th><th>C. Afec.</th><th>% Inc.</th></tr>';
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      rows.forEach(function(row, idx) {
        var tr = document.createElement('tr');
        if (row.plaga === 'Punto sano') tr.className = 'row-sano';
        else if (idx % 2 === 0) tr.className = 'row-alt';
        var pct = camasMonitoreadas > 0 ? ((row.afectadas / camasMonitoreadas) * 100).toFixed(2) : '0.00';
        tr.innerHTML =
          '<td>' + row.plaga + '</td>' +
          '<td>' + semanaNum + '</td>' +
          '<td>' + camasMonitoreadas + '</td>' +
          '<td>' + row.afectadas + '</td>' +
          '<td>' + pct + '%</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.appendChild(table);
      groupCard.appendChild(tableWrap);
    }

    main.appendChild(groupCard);
  });

  wrap.appendChild(main);
}

function camasConDatos() {
  var set = {};
  monitoreos.forEach(function(r) {
    var rFinca = String(r.Finca || r.finca || '');
    var rLote = String(r.Lote || r.lote || '');
    if (rFinca === st.finca && rLote === 'Lote ' + st.loteNum) {
      set[String(r.Cama || r.cama || '')] = true;
    }
  });
  return set;
}

// ===== Render principal =====
function render() {
  renderSummary();
  var main = document.getElementById('main');
  main.innerHTML = '';

  if (!st.finca) { main.appendChild(buildFincaStep()); return; }
  if (!st.loteNum) { main.appendChild(buildLoteStep()); return; }
  if (!st.cama) { main.appendChild(buildCamaStep()); return; }
  main.appendChild(buildWorkStep());
}

function renderSummary() {
  var cells = [
    {label:'Fecha', value: fmtDate(st.fecha), key:'fecha'},
    {label:'Finca', value: st.finca, key:'finca'},
    {label:'Lote', value: st.loteNum ? ('Lote ' + st.loteNum) : '', key:'lote'},
    {label:'Variedad', value: st.variedad, key:'variedad'},
    {label:'Cama', value: st.cama, key:'cama'},
    {label:'Punto', value: st.cama ? ('Punto ' + st.puntoActivo) : '', key:'punto'}
  ];
  var el = document.getElementById('summary');
  el.innerHTML = '';
  cells.forEach(function(c) {
    var cell = document.createElement('div');
    cell.className = 'summary-cell';
    var lbl = document.createElement('div');
    lbl.className = 'summary-label';
    lbl.textContent = c.label;
    var val = document.createElement('div');
    val.className = 'summary-value' + (c.value ? '' : ' empty');
    val.textContent = c.value || 'Sin definir';
    cell.appendChild(lbl);
    cell.appendChild(val);
    cell.onclick = function() { onSummaryTap(c.key); };
    el.appendChild(cell);
  });
}

function onSummaryTap(key) {
  if (key === 'fecha') {
    var nueva = prompt('Nueva fecha (AAAA-MM-DD):', st.fecha);
    if (nueva) { st.fecha = nueva; render(); }
    return;
  }
  if (key === 'finca') { st.finca = ''; st.loteNum = ''; st.cama = ''; render(); return; }
  if (key === 'lote' || key === 'variedad') { st.loteNum = ''; st.variedad = ''; st.fechaInicioLote = ''; st.camasTotal = 0; st.cama = ''; render(); return; }
  if (key === 'cama' || key === 'punto') { st.cama = ''; render(); return; }
}

// ===== Paso: Finca =====
function buildFincaStep() {
  var wrap = document.createElement('div');
  var title = document.createElement('div');
  title.className = 'step-title';
  title.textContent = 'Finca';
  wrap.appendChild(title);

  var grid = document.createElement('div');
  grid.className = 'btn-grid';
  FINCAS.forEach(function(f) {
    var btn = document.createElement('button');
    btn.className = 'pick-btn';
    btn.textContent = f;
    btn.onclick = function() { st.finca = f; render(); };
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ===== Paso: Lote =====
function buildLoteStep() {
  var wrap = document.createElement('div');
  var title = document.createElement('div');
  title.className = 'step-title';
  title.textContent = 'Lote';
  wrap.appendChild(title);

  var grid = document.createElement('div');
  grid.className = 'btn-grid cols-2';
  for (var i = 1; i <= 33; i++) {
    (function(n) {
      var btn = document.createElement('button');
      btn.className = 'pick-btn';
      btn.textContent = 'Lote ' + n;
      btn.onclick = function() {
        st.loteNum = n;
        var l = lotes.find(function(x) {
          return String(x.Finca || x.finca || '') === String(st.finca) &&
                 String(x.Lote || x.lote || '') === String(n) &&
                 String(x.Estado || x.estado || '').toLowerCase() === 'activo';
        });
        st.variedad = l ? (l.Variedad || l.variedad || '') : '';
        st.fechaInicioLote = l ? getISO(l.Fecha_Inicio || l.fecha_inicio || '') : '';
        var camasVal = l ? parseInt(l.Camas || l.camas || '0', 10) : 0;
        st.camasTotal = camasVal > 0 ? camasVal : 20;
        render();
      };
      grid.appendChild(btn);
    })(i);
  }
  wrap.appendChild(grid);
  return wrap;
}

// ===== Paso: Cama =====
function buildCamaStep() {
  var wrap = document.createElement('div');
  var title = document.createElement('div');
  title.className = 'step-title';
  title.textContent = 'Cama';
  wrap.appendChild(title);

  if (!st.variedad) {
    var warn = document.createElement('div');
    warn.className = 'info-box';
    warn.textContent = 'No hay un ciclo activo registrado para este lote en Fincas Montova. Puedes continuar, pero revisa si el lote esta bien programado.';
    wrap.appendChild(warn);
  } else {
    var semana = calcSemanaCiclo(st.fechaInicioLote);
    var info = document.createElement('div');
    info.className = 'info-box';
    info.innerHTML =
      '<div><strong>Variedad:</strong> ' + st.variedad + '</div>' +
      '<div><strong>Fecha de inicio del lote:</strong> ' + (st.fechaInicioLote ? fmtDate(st.fechaInicioLote) : 'Sin registrar') + '</div>' +
      '<div><strong>Semana del ciclo:</strong> ' + (semana !== null ? semana : '-') + '</div>';
    wrap.appendChild(info);
  }

  var legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = '<span><span class="dot"></span> Sin monitorear</span><span><span class="dot visited"></span> Ya tiene registro</span>';
  wrap.appendChild(legend);

  var visitadas = camasConDatos();

  var grid = document.createElement('div');
  grid.className = 'btn-grid cols-2';
  for (var i = 1; i <= st.camasTotal; i++) {
    (function(n) {
      var btn = document.createElement('button');
      var yaVisitada = !!visitadas[String(n)];
      btn.className = 'pick-btn' + (yaVisitada ? ' visited' : '');
      btn.textContent = n;
      btn.onclick = function() {
        st.cama = String(n);
        puntosCheck = {1:[], 2:[], 3:[]}; puntosSeveridad = {1:{}, 2:{}, 3:{}};
        st.puntoActivo = 1;
        render();
      };
      grid.appendChild(btn);
    })(i);
  }
  wrap.appendChild(grid);
  return wrap;
}

// ===== Slider de severidad (Leve / Moderado / Severo) =====
function buildSeverityCard(item, n, sevState) {
  var wrap = document.createElement('div');
  wrap.className = 'sev-card';

  var title = document.createElement('div');
  title.className = 'sev-title';
  title.textContent = item;
  wrap.appendChild(title);

  var touched = Object.prototype.hasOwnProperty.call(sevState, item);
  var nivel = touched ? sevState[item] : null;

  var track = document.createElement('div');
  track.className = 'sev-track';

  var fill = document.createElement('div');
  fill.className = 'sev-track-fill';
  if (touched) {
    fill.style.width = ((nivel + 1) / 3 * 100) + '%';
    fill.style.background = NIVEL_COLORES[nivel];
  } else {
    fill.style.width = '0%';
  }
  track.appendChild(fill);

  var thumb = document.createElement('div');
  thumb.className = 'sev-thumb';
  thumb.style.left = touched ? (((nivel * 2 + 1) / 6) * 100) + '%' : '3%';
  thumb.style.background = touched ? NIVEL_COLORES[nivel] : '#B9C7BF';
  track.appendChild(thumb);

  function setNivelFromClientX(clientX) {
    var rect = track.getBoundingClientRect();
    var pct = (clientX - rect.left) / rect.width;
    if (pct < 0) pct = 0;
    if (pct > 1) pct = 1;
    var lvl = Math.round(pct * 2);
    sevState[item] = lvl;
    render();
  }

  track.addEventListener('click', function(e) {
    setNivelFromClientX(e.clientX);
  });
  track.addEventListener('touchstart', function(e) {
    e.preventDefault();
    setNivelFromClientX(e.touches[0].clientX);
  }, {passive: false});
  track.addEventListener('touchmove', function(e) {
    e.preventDefault();
    setNivelFromClientX(e.touches[0].clientX);
  }, {passive: false});

  wrap.appendChild(track);

  if (touched) {
    var lbl = document.createElement('div');
    lbl.className = 'sev-label';
    lbl.style.color = NIVEL_COLORES[nivel];
    lbl.textContent = NIVELES[nivel];
    var clearBtn = document.createElement('span');
    clearBtn.className = 'sev-clear';
    clearBtn.textContent = 'Quitar';
    clearBtn.onclick = function(e) {
      e.stopPropagation();
      delete sevState[item];
      render();
    };
    var row = document.createElement('div');
    row.className = 'sev-bottom-row';
    row.appendChild(lbl);
    row.appendChild(clearBtn);
    wrap.appendChild(row);
  }

  return wrap;
}


function buildWorkStep() {
  var wrap = document.createElement('div');

  var card = document.createElement('div');
  card.className = 'card';

  var ct = document.createElement('div');
  ct.className = 'card-title';
  ct.textContent = 'Puntos de la cama';
  card.appendChild(ct);

  var grid = document.createElement('div');
  grid.className = 'puntos-grid';
  [1,2,3].forEach(function(n) {
    var btn = document.createElement('button');
    var on = st.puntoActivo === n;
    var items = itemsPunto(n);
    btn.className = 'punto-btn' + (on ? ' on' : '') + (items.length && !on ? ' hasdata' : '');
    var t = document.createElement('div');
    t.className = 'cq-title';
    t.textContent = 'Punto ' + n;
    btn.appendChild(t);
    if (items.length) {
      var l = document.createElement('div');
      l.className = 'cq-list';
      l.textContent = items.join(', ');
      btn.appendChild(l);
    }
    btn.onclick = function() { st.puntoActivo = n; render(); };
    grid.appendChild(btn);
  });
  card.appendChild(grid);

  var pt = document.createElement('div');
  pt.className = 'card-title';
  pt.textContent = 'Plagas / enfermedades - Punto ' + st.puntoActivo;
  card.appendChild(pt);

  var n = st.puntoActivo;
  var sevState = puntosSeveridad[n];
  var checkArr = puntosCheck[n];

  var sevWrap = document.createElement('div');
  sevWrap.className = 'sev-wrap';
  FUM_PLAGAS_SEVERIDAD.forEach(function(item) {
    sevWrap.appendChild(buildSeverityCard(item, n, sevState));
  });
  card.appendChild(sevWrap);

  var lista = document.createElement('div');
  lista.className = 'plagas-lista';
  FUM_PLAGAS_CHECK.forEach(function(item) {
    var btn = document.createElement('button');
    var sel = checkArr.indexOf(item) !== -1;
    btn.className = 'plaga-item' + (sel ? ' sel' : '');
    var chk = document.createElement('div');
    chk.className = 'plaga-chk';
    chk.textContent = sel ? '\u2713' : '';
    var sp = document.createElement('span');
    sp.textContent = item;
    btn.appendChild(chk);
    btn.appendChild(sp);
    btn.onclick = function() {
      var idx = checkArr.indexOf(item);
      if (idx > -1) checkArr.splice(idx, 1); else checkArr.push(item);
      render();
    };
    lista.appendChild(btn);
  });
  card.appendChild(lista);
  wrap.appendChild(card);

  var actions = document.createElement('div');
  actions.className = 'actions-row';

  var totalMarcado = itemsPunto(1).length + itemsPunto(2).length + itemsPunto(3).length;

  var btnGuardar = document.createElement('button');
  btnGuardar.className = 'btn-guardar';
  btnGuardar.textContent = 'Guardar registro';
  btnGuardar.id = 'btn-guardar-mon';
  btnGuardar.disabled = totalMarcado === 0;
  btnGuardar.onclick = monGuardar;
  actions.appendChild(btnGuardar);

  var btnCambiarCama = document.createElement('button');
  btnCambiarCama.className = 'btn-nuevo';
  btnCambiarCama.textContent = 'Cambiar cama';
  btnCambiarCama.onclick = function() { st.cama = ''; render(); };
  actions.appendChild(btnCambiarCama);

  wrap.appendChild(actions);

  var loading = document.createElement('div');
  loading.className = 'status-box status-loading';
  loading.id = 'mon-loading';
  loading.textContent = 'Guardando registro...';
  wrap.appendChild(loading);

  var ok = document.createElement('div');
  ok.className = 'status-box status-ok';
  ok.id = 'mon-ok';
  ok.innerHTML = '<div class="status-ok-title">Registro guardado con exito</div><div class="status-ok-txt" id="mon-ok-txt"></div>';
  wrap.appendChild(ok);

  var err = document.createElement('div');
  err.className = 'status-box status-error';
  err.id = 'mon-error';
  err.textContent = 'Hubo un problema al guardar. Intenta de nuevo.';
  wrap.appendChild(err);

  return wrap;
}

async function postToWS(payload) {
  try {
    await fetch(WS, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  } catch (e) {
    await new Promise(function(res) { setTimeout(res, 1200); });
    await fetch(WS, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  }
}

async function monGuardar() {
  var btn = document.getElementById('btn-guardar-mon');
  btn.disabled = true;
  document.getElementById('mon-loading').style.display = 'block';
  document.getElementById('mon-ok').style.display = 'none';
  document.getElementById('mon-error').style.display = 'none';

  var payload = {
    action: 'addMonitoreo',
    fecha: st.fecha,
    finca: st.finca,
    lote: 'Lote ' + st.loteNum,
    cama: st.cama,
    punto_1: itemsPunto(1).join(', '),
    punto_2: itemsPunto(2).join(', '),
    punto_3: itemsPunto(3).join(', ')
  };

  try {
    await postToWS(payload);
    monitoreos.push({Finca: st.finca, Lote: 'Lote ' + st.loteNum, Cama: st.cama});
    document.getElementById('mon-loading').style.display = 'none';
    document.getElementById('mon-ok-txt').textContent = st.finca + ' \u00b7 Lote ' + st.loteNum + ' \u00b7 Cama ' + st.cama;
    document.getElementById('mon-ok').style.display = 'block';
    st.cama = '';
    puntosCheck = {1:[], 2:[], 3:[]}; puntosSeveridad = {1:{}, 2:{}, 3:{}};
    st.puntoActivo = 1;
    render();
  } catch (e) {
    document.getElementById('mon-loading').style.display = 'none';
    document.getElementById('mon-error').style.display = 'block';
    btn.disabled = false;
  }
}
</script>
